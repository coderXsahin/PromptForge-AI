spring.application.name=promptforge-backend
server.port=8080
spring.jackson.serialization.indent-output=true

openai.api-key=${GROQ_API_KEY:}
openai.base-url=https://api.groq.com/openai/v1
openai.model=openai/gpt-oss-120b
spring.datasource.url=jdbc:postgresql://localhost:5432/promptforge
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false